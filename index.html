<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стихии Битва — v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }
        .header {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .user-stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .badge { background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 40px; }
        .currency { background: linear-gradient(135deg, #f9b42c, #f5a623); color: #1e1a2f; }
        .trophies { background: linear-gradient(135deg, #b83bff, #6a1b9a); }
        button {
            background: linear-gradient(95deg, #5f6cff, #9333ea);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; margin: 20px 0; }
        .card {
            background: linear-gradient(145deg, #1f2a48, #111827);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 2px solid rgba(255,255,240,0.2);
            cursor: pointer;
        }
        .common { border-top: 5px solid #9ca3af; }
        .rare { border-top: 5px solid #3b82f6; }
        .epic { border-top: 5px solid #a855f7; }
        .legendary { border-top: 5px solid #facc15; }
        .mythic { border-top: 5px solid #ff4d4d; box-shadow: 0 0 12px #ff4d4d80; }
        .deck-builder { display: flex; gap: 30px; flex-wrap: wrap; }
        .collection-area, .deck-area { flex: 1; background: rgba(0,0,0,0.3); border-radius: 24px; padding: 20px; }
        .battle-row { display: flex; gap: 30px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .arena { background: rgba(0,0,0,0.5); border-radius: 32px; padding: 20px; flex: 1; min-width: 280px; backdrop-filter: blur(4px); }
        .card-slot {
            display: inline-block;
            background: #0f1422cc;
            margin: 8px;
            padding: 12px;
            border-radius: 18px;
            width: 130px;
            text-align: center;
            cursor: pointer;
        }
        .card-slot.selected { border: 2px solid gold; box-shadow: 0 0 10px gold; }
        .enemy-hidden { filter: blur(4px); background: #2a2f4b; display: flex; align-items: center; justify-content: center; }
        .battle-log { background: #00000066; margin: 16px; padding: 12px; border-radius: 24px; font-size: 14px; max-height: 200px; overflow-y: auto; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000cc; backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: linear-gradient(145deg, #1f2a48, #0f1422); border-radius: 48px; padding: 30px; max-width: 500px; width: 90%; text-align: center; animation: bounce 0.3s ease; }
        @keyframes bounce { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pack-card { display: inline-block; margin: 10px; animation: fly 0.4s ease-out; }
        @keyframes fly { from { transform: translateY(-50px) rotate(-10deg); opacity: 0; } to { transform: translateY(0) rotate(0); opacity: 1; } }
        .hidden { display: none; }
        .auth-container { max-width: 400px; margin: 80px auto; background: #0f142bbb; border-radius: 48px; padding: 32px; text-align: center; }
        .auth-container input, .auth-container select { width: 100%; margin: 12px 0; padding: 12px; border-radius: 40px; border: none; font-size: 16px; }
        .shop-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .pack { background: rgba(0,0,0,0.5); border-radius: 24px; padding: 20px; width: 180px; text-align: center; cursor: pointer; transition: 0.2s; }
        .pack:hover { transform: scale(1.05); background: rgba(0,0,0,0.7); }
        .pack.fire { border: 2px solid #ff4444; }
        .pack.water { border: 2px solid #4488ff; }
        .pack.earth { border: 2px solid #44ff44; }
        .pack.wind { border: 2px solid #ffaa44; }
        .selection-info { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 20px; margin: 10px 0; text-align: center; }
        .code-display { font-size: 32px; font-weight: bold; letter-spacing: 5px; background: #000; padding: 15px; border-radius: 20px; margin: 15px 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

    <div id="mainScreen" class="screen">
        <div class="header">

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:28px;">

            <button id="createBattleBtn">⚔️ Создать PvP</button>

            <button id="botBattleBtn">🤖 Бот</button>
            <button id="leagueBtn">🏆 Лига</button>

        <div id="searchPanel" style="background:rgba(0,0,0,0.5); border-radius:24px; padding:20px; margin-bottom:20px; display:none;">

        </div>

        <div id="deckPanel" class="screen">
            <div class="deck-builder">
                <div class="collection-area">
                    <h3>📚 Коллекция</h3>
                    <div id="collectionGrid" class="cards-grid"></div>
                </div>
                <div class="deck-area">

                    <div id="deckGrid" class="cards-grid"></div>
                </div>
            </div>
        </div>

        <div id="shopPanel" class="screen">
            <h3>🃏 Магазин (100💰 = 3 карты)</h3>
            <div class="shop-grid">
                <div class="pack fire" onclick="buyPack('fire')">🔥 Огонь</div>
                <div class="pack water" onclick="buyPack('water')">💧 Вода</div>
                <div class="pack earth" onclick="buyPack('earth')">🌍 Земля</div>
                <div class="pack wind" onclick="buyPack('wind')">💨 Ветер</div>
            </div>
        </div>

        <div id="leaguePanel" class="screen">
            <div id="leagueInfo"></div>
        </div>

        <div id="battlePanel" class="screen">
            <div style="display: flex; justify-content: space-between;">
                <h3 id="battleOpponentName">Противник</h3>
                <h3>Раунд <span id="roundNum">1</span>/3 | <span id="scoreDisplay">0:0</span></h3>
            </div>
            <div class="battle-row">
                <div class="arena">
                    <div style="text-align:center">❓ ПРОТИВНИК</div>
                    <div id="opponentCardsField" style="min-height: 160px; display: flex; flex-wrap: wrap; justify-content: center;"></div>
                </div>
                <div class="arena">
                    <div style="text-align:center">🎴 ВЫБЕРИ 4 КАРТЫ</div>
                    <div id="playerCardsField" style="min-height: 160px; display: flex; flex-wrap: wrap; justify-content: center;"></div>
                    <div class="selection-info" id="selectionInfo">Выбрано: 0/4</div>
                    <button id="attackBtn">⚔️ АТАКОВАТЬ</button>
                </div>
            </div>
            <div class="battle-log" id="battleLog"></div>
        </div>
    </div>
</div>

<div id="packModal" class="modal hidden">
    <div class="modal-card">
        <h2>🎁 Открытие пака</h2>
        <div id="packCardsList" style="display: flex; flex-wrap: wrap; justify-content: center; margin: 20px 0;"></div>
        <button id="closePackBtn">Закрыть</button>
    </div>
</div>

<div id="battleCodeModal" class="modal hidden">
    <div class="modal-card">

        <div class="code-display" id="battleCodeDisplay"></div>

</div>

        ]
    };

    const elementBonus = {
        fire: { wind: 2.0, earth: 0.5, water: 1.0, fire: 1.0 },
        wind: { earth: 2.0, water: 0.5, fire: 1.0, wind: 1.0 },
        earth: { water: 2.0, fire: 0.5, wind: 1.0, earth: 1.0 },
        water: { fire: 2.0, wind: 0.5, earth: 1.0, water: 1.0 }
    };

    const leagues = [
        { name: "🥉 Бронза", min: 0, max: 500, reward: 100 },
        { name: "🥈 Серебро", min: 500, max: 1200, reward: 250 },
        { name: "🥇 Золото", min: 1200, max: 2000, reward: 500 },
        { name: "💎 Платина", min: 2000, max: 3000, reward: 1000 },
        { name: "🐉 Алмаз", min: 3000, max: 5000, reward: 2000 },
        { name: "👑 Легенда", min: 5000, max: 999999, reward: 5000 }
    ];

    let currentUser = null;
    let currentBattle = null;
    let currentSelected = [];
    let currentSquad = [];
    let currentBattleId = null;
    let pvpInterval = null;

    function getRandomCardByElement(element, forcedRarity = null) {
        let pool = cardsDB[element];
        if (forcedRarity) pool = pool.filter(c => c.rarity === forcedRarity);
        return { ...pool[Math.floor(Math.random() * pool.length)] };
    }

    function getStarterCards(element) {
        let pool = [...cardsDB[element]];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        let cards = [];
        for (let i = 0; i < 6; i++) {
            cards.push({ ...pool[i], count: 1 });
        }
        return cards;
    }

    async function saveUser() {
        if (!currentUser) return;
        await sb.from("users").upsert({
            id: currentUser.id,
            username: currentUser.username,
            password_hash: currentUser.password_hash,
            element: currentUser.element,
            currency: currentUser.currency,
            trophies: currentUser.trophies,
            collection: currentUser.collection,
            deck: currentUser.deck
        });
    }

    async function loadUser(userId) {
        let { data } = await sb.from("users").select("*").eq("id", userId).single();
        if (data) {
            currentUser = data;
            if (!currentUser.collection) currentUser.collection = [];
            if (!currentUser.deck) currentUser.deck = [];
            updateUI();
            renderCards();
        }
    }

    function saveSession() {
        if (currentUser) localStorage.setItem("session", JSON.stringify({ userId: currentUser.id }));
    }

    function loadSession() {
        let session = localStorage.getItem("session");
        if (session) loadUser(JSON.parse(session).userId);
    }

    async function register() {
        let username = document.getElementById("regUsername").value.trim();
        let password = document.getElementById("regPassword").value;
        let element = document.getElementById("regElement").value;
        if (!username || !password) { alert("Заполни всё!"); return; }
        
        let hash = btoa(password);
        let { data: existing } = await sb.from("users").select("id").eq("username", username);
        if (existing?.length) { alert("Имя занято!"); return; }
        
        let starterCards = getStarterCards(element);
        let starterDeck = starterCards.map(c => ({ name: c.name, rarity: c.rarity, damage: c.damage }));
        
        let { data, error } = await sb.from("users").insert({
            username, password_hash: hash, element,
            currency: 0, trophies: 0,
            collection: starterCards, deck: starterDeck
        }).select().single();
        
        if (error) { alert("Ошибка: " + error.message); return; }
        currentUser = data;
        saveSession();
        updateUI();
        renderCards();
        document.getElementById("authScreen").classList.remove("active");
        document.getElementById("mainScreen").classList.add("active");
        document.getElementById("deckPanel").classList.add("active");
    }

    async function login() {
        let username = document.getElementById("loginUsername").value.trim();
        let password = document.getElementById("loginPassword").value;
        let hash = btoa(password);
        let { data, error } = await sb.from("users").select("*").eq("username", username).eq("password_hash", hash).single();
        if (error || !data) { alert("Неверно!"); return; }
        currentUser = data;
        saveSession();
        updateUI();
        renderCards();
        document.getElementById("authScreen").classList.remove("active");
        document.getElementById("mainScreen").classList.add("active");
        document.getElementById("deckPanel").classList.add("active");
    }

    function updateUI() {
        if (!currentUser) return;
        document.getElementById("currencyDisplay").innerHTML = `💰 ${currentUser.currency}`;
        document.getElementById("trophiesDisplay").innerHTML = `🏆 ${currentUser.trophies}`;
        let league = leagues.find(l => currentUser.trophies >= l.min && currentUser.trophies < l.max) || leagues[5];
        document.getElementById("leagueDisplay").innerHTML = league.name;
        let elemIcon = currentUser.element === "fire" ? "🔥" : currentUser.element === "water" ? "💧" : currentUser.element === "earth" ? "🌍" : "💨";
        document.getElementById("userNameDisplay").innerHTML = `${currentUser.username} ${elemIcon}`;
    }

    function renderCards() {
        if (!currentUser) return;
        let collectionDiv = document.getElementById("collectionGrid");
        let deckDiv = document.getElementById("deckGrid");
        document.getElementById("deckCount").innerText = currentUser.deck?.length || 0;

        collectionDiv.innerHTML = (currentUser.collection || []).filter(c => c.count > 0).map(card => `
            <div class="card ${card.rarity}" onclick="addToDeck('${card.name}')">
                <b>${card.name}</b><br>⚔️ ${card.damage}<br>✖️${card.count}
            </div>
        `).join('');

        deckDiv.innerHTML = (currentUser.deck || []).map((card, i) => `
            <div class="card ${card.rarity}" onclick="removeFromDeck(${i})">
                <b>${card.name}</b><br>⚔️ ${card.damage}<br>[убрать]
            </div>
        `).join('');
    }

    window.addToDeck = (name) => {
        let card = currentUser.collection.find(c => c.name === name);
        if (!card || card.count <= 0) return;
        if (currentUser.deck.length >= 12) { alert("12 карт максимум"); return; }
        if (currentUser.deck.some(c => c.name === name)) { alert("Уникальные карты!"); return; }
        currentUser.deck.push({ name: card.name, rarity: card.rarity, damage: card.damage });
        card.count--;
        renderCards();
        saveUser();
    };

    window.removeFromDeck = (idx) => {
        let removed = currentUser.deck[idx];
        let original = currentUser.collection.find(c => c.name === removed.name);
        if (original) original.count++;
        currentUser.deck.splice(idx, 1);
        renderCards();
        saveUser();
    };

    async function buyPack(element) {
        if (currentUser.currency < 100) { alert("Мало монет!"); return; }
        currentUser.currency -= 100;
        let newCards = [];
        for (let i = 0; i < 3; i++) newCards.push(getRandomCardByElement(element));
        for (let card of newCards) {
            let existing = currentUser.collection.find(c => c.name === card.name);
            if (existing) existing.count++;
            else currentUser.collection.push({ ...card, count: 1 });
        }
        await saveUser();
        renderCards();
        updateUI();
        
        let modal = document.getElementById("packModal");
        let container = document.getElementById("packCardsList");
        container.innerHTML = newCards.map(c => `<div class="pack-card card ${c.rarity}"><b>${c.name}</b><br>⚔️ ${c.damage}</div>`).join('');
        modal.classList.remove("hidden");
        document.getElementById("closePackBtn").onclick = () => modal.classList.add("hidden");
    }

    function getRandomSquad() {
        let shuffled = [...currentUser.deck];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, 6);
    }

    function computeDamage(attacker, attackerElem, defenderElem) {
        let mult = elementBonus[attackerElem][defenderElem] || 1;
        return Math.floor(attacker.damage * mult);
    }

    async function startBotBattle() {
        if (!currentUser.deck || currentUser.deck.length < 6) { alert("Собери 6+ карт в колоду!"); return; }
        currentSquad = getRandomSquad();
        currentSelected = [];
        let oppElem = ["fire","water","earth","wind"][Math.floor(Math.random()*4)];
        let oppSquad = [];
        for (let i=0;i<6;i++) oppSquad.push(getRandomCardByElement(oppElem));
        currentBattle = { isBot: true, opponentElement: oppElem, opponentSquad: oppSquad, round: 1, playerScore: 0, opponentScore: 0 };
        showBattleScreen();
    }

    function showBattleScreen() {
        document.getElementById("battlePanel").classList.add("active");
        document.getElementById("deckPanel").classList.remove("active");
        document.getElementById("shopPanel").classList.remove("active");
        document.getElementById("leaguePanel").classList.remove("active");
        document.getElementById("searchPanel").style.display = "none";
        
        let elemIcon = currentBattle.opponentElement === "fire" ? "🔥" : currentBattle.opponentElement === "water" ? "💧" : currentBattle.opponentElement === "earth" ? "🌍" : "💨";
        document.getElementById("battleOpponentName").innerHTML = currentBattle.isBot ? `🤖 Бот ${elemIcon}` : "👤 Игрок";
        document.getElementById("roundNum").innerHTML = currentBattle.round;
        document.getElementById("scoreDisplay").innerHTML = `${currentBattle.playerScore}:${currentBattle.opponentScore}`;
        document.getElementById("battleLog").innerHTML = "Выбери 4 карты для атаки!";
        updateBattleDisplay();
        updateSelection();
    }

    function updateBattleDisplay() {
        let playerField = document.getElementById("playerCardsField");
        playerField.innerHTML = currentSquad.map((card, idx) => `
            <div class="card-slot ${card.rarity} ${currentSelected.includes(idx) ? 'selected' : ''}" onclick="toggleSelect(${idx})">
                <b>${card.name}</b><br>⚔️ ${card.damage}
            </div>
        `).join('');
        let oppField = document.getElementById("opponentCardsField");
        oppField.innerHTML = Array(6).fill().map(() => `<div class="card-slot enemy-hidden">❓❓❓</div>`).join('');
    }

    function updateSelection() {
        document.getElementById("selectionInfo").innerHTML = `Выбрано: ${currentSelected.length}/4`;
        document.getElementById("attackBtn").disabled = currentSelected.length !== 4;
    }

    window.toggleSelect = (idx) => {
        let index = currentSelected.indexOf(idx);
        if (index === -1) {
            if (currentSelected.length < 4) currentSelected.push(idx);
        } else {
            currentSelected.splice(index, 1);
        }
        updateBattleDisplay();
        updateSelection();
    };

    async function attack() {
        if (currentSelected.length !== 4) { alert("Выбери 4 карты!"); return; }
        
        let attacking = currentSelected.map(i => currentSquad[i]);
        let playerTotal = 0;
        let logs = [];
        for (let card of attacking) {
            let dmg = computeDamage(card, currentUser.element, currentBattle.opponentElement);
            playerTotal += dmg;
            logs.push(`${card.name} → ${currentBattle.opponentElement} = ${dmg}`);
        }
        
        let shuffledOpp = [...currentBattle.opponentSquad];
        for (let i = shuffledOpp.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledOpp[i], shuffledOpp[j]] = [shuffledOpp[j], shuffledOpp[i]];
        }
        let defending = shuffledOpp.slice(0, 4);
        let opponentTotal = 0;
        for (let card of defending) {
            let dmg = computeDamage(card, currentBattle.opponentElement, currentUser.element);
            opponentTotal += dmg;
            logs.push(`Враг (${card.name}) → ${currentUser.element} = ${dmg}`);
        }
        
        if (playerTotal > opponentTotal) {
            currentBattle.playerScore++;
            logs.push(`✅ ВЫИГРАЛ РАУНД: ${playerTotal} vs ${opponentTotal}`);
        } else if (opponentTotal > playerTotal) {
            currentBattle.opponentScore++;
            logs.push(`❌ ПРОИГРАЛ РАУНД: ${playerTotal} vs ${opponentTotal}`);
        } else {
            logs.push(`🤝 НИЧЬЯ: ${playerTotal} vs ${opponentTotal}`);
        }
        
        document.getElementById("battleLog").innerHTML = logs.join("<br>");
        document.getElementById("scoreDisplay").innerHTML = `${currentBattle.playerScore}:${currentBattle.opponentScore}`;
        
        if (currentBattle.round === 3) {
            await endBattle();
        } else {
            currentBattle.round++;
            document.getElementById("roundNum").innerHTML = currentBattle.round;
            currentSquad = getRandomSquad();
            currentSelected = [];
            updateBattleDisplay();
            updateSelection();
            document.getElementById("battleLog").innerHTML = `Раунд ${currentBattle.round}. Выбери 4 карты!`;
        }
    }

    async function endBattle() {
        let playerWon = currentBattle.playerScore > currentBattle.opponentScore;
        let trophies = playerWon ? 25 : -8;
        let coins = playerWon ? (currentBattle.isBot ? 100 : 50) : 0;
        currentUser.trophies = Math.max(0, currentUser.trophies + trophies);
        currentUser.currency += coins;
        await saveUser();
        updateUI();
        alert(`${playerWon ? "ПОБЕДА!" : "ПОРАЖЕНИЕ"}\n🏆 ${trophies > 0 ? "+" : ""}${trophies}\n💰 +${coins}`);
        currentBattle = null;
        document.getElementById("battlePanel").classList.remove("active");
        document.getElementById("deckPanel").classList.add("active");
    }

    async function createBattle() {
        if (!currentUser.deck || currentUser.deck.length < 6) { alert("Собери 6+ карт!"); return; }
        let code = Math.random().toString(36).substring(2, 8).toUpperCase();
        let squad = getRandomSquad();
        let { data, error } = await sb.from("battles").insert({
            battle_code: code,
            player1_id: currentUser.id,
            player1_username: currentUser.username,
            player1_element: currentUser.element,
            player1_squad: squad,
            status: "waiting",
            round: 1
        }).select().single();
        if (error) { alert("Ошибка: " + error.message); return; }
        document.getElementById("battleCodeDisplay").innerText = code;
        document.getElementById("battleCodeModal").classList.remove("hidden");
        document.getElementById("closeCodeBtn").onclick = () => {
            document.getElementById("battleCodeModal").classList.add("hidden");
            currentBattleId = data.id;
            startPvpListener();
        };
    }

    async function joinBattle() {
        let code = document.getElementById("battleCodeInput").value.trim().toUpperCase();
        if (!code) { alert("Введи код!"); return; }
        if (!currentUser.deck || currentUser.deck.length < 6) { alert("Собери 6+ карт!"); return; }
        let squad = getRandomSquad();
        let { data, error } = await sb.from("battles").update({
            player2_id: currentUser.id,
            player2_username: currentUser.username,
            player2_element: currentUser.element,
            player2_squad: squad,
            status: "active"
        }).eq("battle_code", code).eq("status", "waiting").select().single();
        if (error) { alert("Бой не найден!"); return; }
        currentBattleId = data.id;
        alert("Присоединился!");
        startPvpListener();
    }

    function startPvpListener() {
        if (pvpInterval) clearInterval(pvpInterval);
        pvpInterval = setInterval(async () => {
            if (!currentBattleId) return;
            let { data } = await sb.from("battles").select("*").eq("id", currentBattleId).single();
            if (data?.status === "finished") {
                clearInterval(pvpInterval);
                alert("Бой завершён!");
                currentBattleId = null;
            }
        }, 2000);
    }

    document.getElementById("doRegisterBtn").onclick = register;
    document.getElementById("doLoginBtn").onclick = login;
    document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); location.reload(); };
    document.getElementById("toDeckBtn").onclick = () => { document.getElementById("deckPanel").classList.add("active"); document.getElementById("shopPanel").classList.remove("active"); document.getElementById("leaguePanel").classList.remove("active"); document.getElementById("battlePanel").classList.remove("active"); renderCards(); };
    document.getElementById("toShopBtn").onclick = () => { document.getElementById("shopPanel").classList.add("active"); document.getElementById("deckPanel").classList.remove("active"); document.getElementById("leaguePanel").classList.remove("active"); document.getElementById("battlePanel").classList.remove("active"); };
    document.getElementById("leagueBtn").onclick = () => { 
        let league = leagues.find(l => currentUser.trophies >= l.min && currentUser.trophies < l.max) || leagues[5];
        document.getElementById("leagueInfo").innerHTML = `<div style="background:#00000055; border-radius:24px; padding:20px;"><h3>${league.name}</h3><p>🎁 ${league.reward} монет</p></div>`;
        document.getElementById("leaguePanel").classList.add("active");
    };
    document.getElementById("botBattleBtn").onclick = startBotBattle;
    document.getElementById("createBattleBtn").onclick = createBattle;
    document.getElementById("findBattleBtn").onclick = () => { document.getElementById("searchPanel").style.display = "block"; };
    document.getElementById("joinBattleBtn").onclick = joinBattle;
    document.getElementById("attackBtn").onclick = attack;

    loadSession();
</script>
</body>
</html>
