<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стихии Битва — с анимацией атаки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }
        .header {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .user-stats { display: flex; gap: 20px; font-weight: bold; flex-wrap: wrap; }
        .badge { background: rgba(0, 0, 0, 0.6); padding: 6px 16px; border-radius: 40px; }
        .currency { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1e1a2f; }
        .trophies { background: linear-gradient(135deg, #b83bff, #6a1b9a); }
        button {
            background: linear-gradient(95deg, #5f6cff, #9333ea);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; margin: 20px 0; }
        .card {
            background: linear-gradient(145deg, #1f2a48, #111827);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 2px solid rgba(255,255,240,0.2);
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .common { border-top: 5px solid #9ca3af; }
        .rare { border-top: 5px solid #3b82f6; }
        .epic { border-top: 5px solid #a855f7; }
        .legendary { border-top: 5px solid #facc15; }
        .mythic { border-top: 5px solid #ff4d4d; box-shadow: 0 0 12px #ff4d4d80; }
        .deck-builder { display: flex; gap: 30px; flex-wrap: wrap; }
        .collection-area, .deck-area { flex: 1; background: rgba(0,0,0,0.3); border-radius: 24px; padding: 20px; }
        .battle-row { display: flex; gap: 30px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .arena { background: rgba(0,0,0,0.5); border-radius: 32px; padding: 20px; flex: 1; min-width: 280px; backdrop-filter: blur(4px); }
        .card-slot {
            display: inline-block;
            background: #0f1422cc;
            margin: 8px;
            padding: 12px;
            border-radius: 18px;
            width: 130px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-slot.selected { border: 2px solid gold; box-shadow: 0 0 10px gold; transform: scale(1.02); }
        .card-slot.attacking {
            animation: attackShake 0.3s ease-out;
        }
        @keyframes attackShake {
            0% { transform: translateX(0); background: #ff4444; }
            25% { transform: translateX(-5px); background: #ff6666; }
            50% { transform: translateX(5px); background: #ff4444; }
            75% { transform: translateX(-3px); background: #ff6666; }
            100% { transform: translateX(0); background: #0f1422cc; }
        }
        .enemy-card-hit {
            animation: hitFlash 0.3s ease-out;
        }
        @keyframes hitFlash {
            0% { background: #ff4444; transform: scale(1); }
            50% { background: #ff8888; transform: scale(1.05); }
            100% { background: #0f1422cc; transform: scale(1); }
        }
        .enemy-hidden { filter: blur(4px); background: #2a2f4b; display: flex; align-items: center; justify-content: center; }
        .battle-log { background: #00000066; margin: 16px; padding: 12px; border-radius: 24px; font-size: 14px; max-height: 200px; overflow-y: auto; }
        .damage-number {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 5px black;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000cc; backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: linear-gradient(145deg, #1f2a48, #0f1422); border-radius: 48px; padding: 30px; max-width: 500px; width: 90%; text-align: center; animation: bounce 0.3s ease; }
        @keyframes bounce { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pack-card { display: inline-block; margin: 10px; animation: fly 0.4s ease-out; }
        @keyframes fly { from { transform: translateY(-50px) rotate(-10deg); opacity: 0; } to { transform: translateY(0) rotate(0); opacity: 1; } }
        .hidden { display: none; }
        .auth-container { max-width: 400px; margin: 80px auto; background: #0f142bbb; border-radius: 48px; padding: 32px; text-align: center; }
        .auth-container input, .auth-container select { width: 100%; margin: 12px 0; padding: 12px; border-radius: 40px; border: none; font-size: 16px; }
        .shop-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .pack { background: rgba(0,0,0,0.5); border-radius: 24px; padding: 20px; width: 180px; text-align: center; cursor: pointer; transition: 0.2s; }
        .pack:hover { transform: scale(1.05); background: rgba(0,0,0,0.7); }
        .pack.fire { border: 2px solid #ff4444; }
        .pack.water { border: 2px solid #4488ff; }
        .pack.earth { border: 2px solid #44ff44; }
        .pack.wind { border: 2px solid #ffaa44; }
        .selection-info { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 20px; margin: 10px 0; text-align: center; }
        .lobby-container { background: rgba(0,0,0,0.4); border-radius: 32px; padding: 20px; margin-bottom: 20px; }
        .battle-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .battle-item {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .battle-code { font-size: 20px; font-weight: bold; font-family: monospace; background: #000; padding: 5px 15px; border-radius: 20px; }
        .join-btn { background: #44ff44; color: #000; }
        .delete-btn { background: #ff4444; }
        .status-waiting { color: #ffaa44; }
        .status-active { color: #44ff44; }
        .code-display { font-size: 32px; text-align: center; background: #000; padding: 15px; border-radius: 20px; margin: 20px; font-family: monospace; letter-spacing: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
    <!-- АВТОРИЗАЦИЯ -->

    <!-- ОСНОВНАЯ ИГРА -->

            <div class="user-stats">

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:28px;">

                </div>

                </div>
            </div>
        </div>

        <!-- ОЖИДАНИЕ БОЯ -->
        <div id="waitingPanel" class="screen">
            <div class="lobby-container">
                <h3>⏳ Ожидание соперника...</h3>

                <div id="playersList" style="background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; margin: 20px 0;"></div>
                <button id="cancelBattleBtn" style="background: #ff4444;">Отменить</button>
            </div>
        </div>

        <!-- КОЛЛЕКЦИЯ -->
        <div id="deckPanel" class="screen">
            <div class="deck-builder">
                <div class="collection-area">
                    <h3>📚 Коллекция</h3>
                    <div id="collectionGrid" class="cards-grid"></div>
                </div>
                <div class="deck-area">
                    <h3>⚔️ Колода (<span id="deckCount">0</span>/12)</h3>
                    <div id="deckGrid" class="cards-grid"></div>
                </div>
            </div>
        </div>

        <!-- МАГАЗИН -->
        <div id="shopPanel" class="screen">
            <h3>🃏 Магазин (100💰 = 3 карты)</h3>
            <div class="shop-grid">
                <div class="pack fire" onclick="buyPack('fire')">🔥 Огонь</div>
                <div class="pack water" onclick="buyPack('water')">💧 Вода</div>
                <div class="pack earth" onclick="buyPack('earth')">🌍 Земля</div>
                <div class="pack wind" onclick="buyPack('wind')">💨 Ветер</div>
            </div>
        </div>

        <!-- ЛИГА -->
        <div id="leaguePanel" class="screen">
            <div id="leagueInfo"></div>
        </div>

        <!-- БОЕВОЙ ЭКРАН -->
        <div id="battlePanel" class="screen">
            <div style="display: flex; justify-content: space-between;">
                <h3 id="battleOpponentName">Противник</h3>
                <h3>Раунд <span id="roundNum">1</span>/3 | <span id="scoreDisplay">0:0</span></h3>
            </div>
            <div class="battle-row">
                <div class="arena">
                    <div style="text-align:center">❓ ПРОТИВНИК</div>
                    <div id="opponentCardsField" style="min-height: 160px; display: flex; flex-wrap: wrap; justify-content: center;"></div>
                </div>
                <div class="arena">
                    <div style="text-align:center">🎴 ВЫБЕРИ 4 КАРТЫ</div>
                    <div id="playerCardsField" style="min-height: 160px; display: flex; flex-wrap: wrap; justify-content: center;"></div>
                    <div class="selection-info" id="selectionInfo">Выбрано: 0/4</div>
                    <button id="attackBtn">⚔️ АТАКОВАТЬ</button>
                </div>
            </div>
            <div class="battle-log" id="battleLog"></div>
        </div>
    </div>
</div>

<div id="packModal" class="modal hidden">
    <div class="modal-card">
        <h2>🎁 Открытие пака</h2>
        <div id="packCardsList" style="display: flex; flex-wrap: wrap; justify-content: center; margin: 20px 0;"></div>
        <button id="closePackBtn">Закрыть</button>
    </div>
</div>

        ],
        wind: [

            { name: "Ветряная стрела", rarity: "common", damage: 11 },
            { name: "Буревестник", rarity: "common", damage: 12 },
            { name: "Облачный странник", rarity: "common", damage: 10 },
            { name: "Вихрь", rarity: "common", damage: 11 },
            { name: "Грозовой дух", rarity: "rare", damage: 16 },
            { name: "Сильф", rarity: "rare", damage: 17 },
            { name: "Птица-гром", rarity: "rare", damage: 15 },
            { name: "Воздушный элементаль", rarity: "rare", damage: 18 },
            { name: "Повелитель бурь", rarity: "epic", damage: 24 },
            { name: "Циклон", rarity: "epic", damage: 25 },
            { name: "Грифон", rarity: "epic", damage: 26 },
            { name: "Дракон ветра", rarity: "legendary", damage: 35 },
            { name: "Буревой король", rarity: "legendary", damage: 36 },
            { name: "Аэрос", rarity: "mythic", damage: 55 }
        ]
    };

    const elementBonus = {
        fire: { wind: 2.0, earth: 0.5, water: 1.0, fire: 1.0 },
        wind: { earth: 2.0, water: 0.5, fire: 1.0, wind: 1.0 },
        earth: { water: 2.0, fire: 0.5, wind: 1.0, earth: 1.0 },
        water: { fire: 2.0, wind: 0.5, earth: 1.0, water: 1.0 }
    };

    const leagues = [
        { name: "🥉 Бронза", min: 0, max: 500, reward: 100 },
        { name: "🥈 Серебро", min: 500, max: 1200, reward: 250 },
        { name: "🥇 Золото", min: 1200, max: 2000, reward: 500 },
        { name: "💎 Платина", min: 2000, max: 3000, reward: 1000 },
        { name: "🐉 Алмаз", min: 3000, max: 5000, reward: 2000 },
        { name: "👑 Легенда", min: 5000, max: 999999, reward: 5000 }
    ];

    let currentUser = null;
    let currentBattle = null;
    let currentSelected = [];
    let currentSquad = [];
    let currentBattleId = null;
    let lobbyInterval = null;
    let waitingInterval = null;
    let battleInterval = null;

    // ВИЗУАЛЬНЫЕ ЭФФЕКТЫ
    function showDamageNumber(element, damage, isEnemy = true) {
        const rect = element.getBoundingClientRect();
        const damageDiv = document.createElement('div');
        damageDiv.className = 'damage-number';
        damageDiv.textContent = `-${damage}`;
        damageDiv.style.left = `${rect.left + rect.width / 2 - 20}px`;
        damageDiv.style.top = `${rect.top}px`;
        document.body.appendChild(damageDiv);
        setTimeout(() => damageDiv.remove(), 800);
        
        if (isEnemy) {
            element.classList.add('enemy-card-hit');
            setTimeout(() => element.classList.remove('enemy-card-hit'), 300);
        } else {
            element.classList.add('attacking');
            setTimeout(() => element.classList.remove('attacking'), 300);
        }
    }

    // ===== ВСПОМОГАТЕЛЬНЫЕ =====
    function getRandomCardByElement(element, forcedRarity = null) {
        let pool = cardsDB[element];
        if (forcedRarity) pool = pool.filter(c => c.rarity === forcedRarity);
        return { ...pool[Math.floor(Math.random() * pool.length)] };
    }

    function getStarterCards(element) {
        let pool = [...cardsDB[element]];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        let cards = [];
        for (let i = 0; i < 6; i++) cards.push({ ...pool[i], count: 1 });
        return cards;
    }

    function getRandomSquad() {
        if (!currentUser?.deck?.length) return [];
        let shuffled = [...currentUser.deck];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, 6);
    }

    function computeDamage(attacker, attackerElem, defenderElem) {
        let mult = elementBonus[attackerElem][defenderElem] || 1;
        return Math.floor(attacker.damage * mult);
    }

    // ===== БД =====
    async function saveUser() {
        if (!currentUser) return;
        await sb.from("users").upsert({
            id: currentUser.id,
            username: currentUser.username,
            password_hash: currentUser.password_hash,
            element: currentUser.element,
            currency: currentUser.currency,
            trophies: currentUser.trophies,
            collection: currentUser.collection,
            deck: currentUser.deck
        });
    }

    async function loadUser(userId) {
        let { data } = await sb.from("users").select("*").eq("id", userId).single();
        if (data) {
            currentUser = data;
            if (!currentUser.collection) currentUser.collection = [];
            if (!currentUser.deck) currentUser.deck = [];
            updateUI();
            renderCards();
        }
    }

    function saveSession() {
        if (currentUser) localStorage.setItem("session", JSON.stringify({ userId: currentUser.id }));
    }

    function loadSession() {
        let session = localStorage.getItem("session");
        if (session) loadUser(JSON.parse(session).userId);
    }

    // ===== UI =====
    function updateUI() {
        if (!currentUser) return;
        document.getElementById("currencyDisplay").innerHTML = `💰 ${currentUser.currency}`;
        document.getElementById("trophiesDisplay").innerHTML = `🏆 ${currentUser.trophies}`;
        let league = leagues.find(l => currentUser.trophies >= l.min && currentUser.trophies < l.max) || leagues[5];
        document.getElementById("leagueDisplay").innerHTML = league.name;
        let elemIcon = currentUser.element === "fire" ? "🔥" : currentUser.element === "water" ? "💧" : currentUser.element === "earth" ? "🌍" : "💨";
        document.getElementById("userNameDisplay").innerHTML = `${currentUser.username} ${elemIcon}`;
    }

    function renderCards() {
        if (!currentUser) return;
        let collectionDiv = document.getElementById("collectionGrid");
        let deckDiv = document.getElementById("deckGrid");
        document.getElementById("deckCount").innerText = currentUser.deck?.length || 0;

        collectionDiv.innerHTML = (currentUser.collection || []).filter(c => c.count > 0).map(card => `
            <div class="card ${card.rarity}" onclick="addToDeck('${card.name}')">
                <b>${card.name}</b><br>⚔️ ${card.damage}<br>✖️${card.count}
            </div>
        `).join('');

        deckDiv.innerHTML = (currentUser.deck || []).map((card, i) => `
            <div class="card ${card.rarity}" onclick="removeFromDeck(${i})">
                <b>${card.name}</b><br>⚔️ ${card.damage}<br>[убрать]
            </div>
        `).join('');
    }

    window.addToDeck = (name) => {
        let card = currentUser.collection.find(c => c.name === name);
        if (!card || card.count <= 0) return;
        if (currentUser.deck.length >= 12) { alert("12 карт максимум"); return; }
        if (currentUser.deck.some(c => c.name === name)) { alert("Уникальные карты!"); return; }
        currentUser.deck.push({ name: card.name, rarity: card.rarity, damage: card.damage });
        card.count--;
        renderCards();
        saveUser();
    };

    window.removeFromDeck = (idx) => {
        let removed = currentUser.deck[idx];
        let original = currentUser.collection.find(c => c.name === removed.name);
        if (original) original.count++;
        currentUser.deck.splice(idx, 1);
        renderCards();
        saveUser();
    };

    async function buyPack(element) {
        if (currentUser.currency < 100) { alert("Мало монет!"); return; }
        currentUser.currency -= 100;
        let newCards = [];
        for (let i = 0; i < 3; i++) newCards.push(getRandomCardByElement(element));
        for (let card of newCards) {
            let existing = currentUser.collection.find(c => c.name === card.name);
            if (existing) existing.count++;
            else currentUser.collection.push({ ...card, count: 1 });
        }
        await saveUser();
        renderCards();
        updateUI();
        
        let modal = document.getElementById("packModal");
        let container = document.getElementById("packCardsList");
        container.innerHTML = newCards.map(c => `<div class="pack-card card ${c.rarity}"><b>${c.name}</b><br>⚔️ ${c.damage}</div>`).join('');
        modal.classList.remove("hidden");
        document.getElementById("closePackBtn").onclick = () => modal.classList.add("hidden");
    }

// ===== ЛОББИ (ИСПРАВЛЕННЫЙ) =====
async function loadLobby() {
    let { data } = await sb.from("battles").select("*").in("status", ["waiting", "active"]).order("created_at", { ascending: false });
    let container = document.getElementById("battleList");
    if (!data || data.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px;">Нет активных боев. Создай свой!</div>';
        return;
    }
    container.innerHTML = data.map(battle => {
        let canJoin = battle.status === "waiting" && battle.player2_id === null && battle.player1_id !== currentUser.id;
        let player1Name = battle.player1_username || "?";
        let player2Name = battle.player2_username || "ожидание...";
        let statusText = battle.status === "waiting" ? "🟡 Ожидание" : "🟢 В бою";
        let statusClass = battle.status === "waiting" ? "status-waiting" : "status-active";
        return `
            <div class="battle-item">
                <div>
                    <span class="battle-code">${battle.battle_code}</span>
                    <div style="margin-top: 5px;">👤 ${player1Name} vs 👤 ${player2Name}</div>
                    <div class="${statusClass}">${statusText}</div>
                </div>
                ${canJoin ? `<button class="join-btn" onclick="joinBattleById(${battle.id})">🔗 Присоединиться</button>` : ''}
                ${battle.player1_id === currentUser.id && battle.status === "waiting" ? `<button class="delete-btn" onclick="cancelBattle(${battle.id})">🗑️ Отменить</button>` : ''}
            </div>
        `;
    }).join('');
}

async function joinBattleById(battleId) {
    if (!currentUser.deck || currentUser.deck.length < 6) { 
        alert("Собери 6+ карт в колоду!"); 
        return; 
    }
    
    let squad = getRandomSquad();
    
    // Получаем текущий бой
    let { data: battleData } = await sb.from("battles").select("*").eq("id", battleId).single();
    if (!battleData || battleData.status !== "waiting") {
        alert("Бой уже начат или не существует!");
        return;
    }
    
    let { data, error } = await sb.from("battles").update({
        player2_id: currentUser.id,
        player2_username: currentUser.username,
        player2_element: currentUser.element,
        player2_squad: squad,
        status: "active",
        current_turn: battleData.player1_id // ход первого игрока
    }).eq("id", battleId).eq("status", "waiting").select().single();
    
    if (error) { 
        alert("Ошибка: " + error.message); 
        return; 
    }
    
    currentBattleId = data.id;
    
    // Закрываем панель ожидания если открыта
    document.getElementById("waitingPanel").classList.remove("active");
    if (waitingInterval) clearInterval(waitingInterval);
    
    // Начинаем бой
    startBattleFromData(data);
}

// ===== ФУНКЦИЯ СТАРТА БОЯ ИЗ ДАННЫХ =====
function startBattleFromData(data) {
    currentBattleId = data.id;
    let isPlayer1 = data.player1_id === currentUser.id;
    let playerSquad = isPlayer1 ? data.player1_squad : data.player2_squad;
    let opponentSquad = isPlayer1 ? data.player2_squad : data.player1_squad;
    let opponentName = isPlayer1 ? (data.player2_username || "Игрок") : (data.player1_username || "Игрок");
    let opponentElement = isPlayer1 ? data.player2_element : data.player1_element;
    
    currentBattle = {
        isBot: false,
        battleId: data.id,
        opponentName: opponentName,
        opponentElement: opponentElement,
        opponentSquad: opponentSquad || [],
        round: data.round || 1,
        playerScore: isPlayer1 ? (data.player1_score || 0) : (data.player2_score || 0),
        opponentScore: isPlayer1 ? (data.player2_score || 0) : (data.player1_score || 0),
        turn: data.current_turn
    };
    currentSquad = playerSquad || [];
    currentSelected = [];
    showBattleScreen();
    startBattleInterval();
}

// ===== ИНТЕРВАЛ ДЛЯ ОБНОВЛЕНИЯ БОЯ =====
function startBattleInterval() {
    if (battleInterval) clearInterval(battleInterval);
    battleInterval = setInterval(async () => {
        if (!currentBattleId) return;
        
        let { data } = await sb.from("battles").select("*").eq("id", currentBattleId).single();
        if (!data) {
            clearInterval(battleInterval);
            return;
        }
        
        // Если бой завершён
        if (data.status === "finished") {
            clearInterval(battleInterval);
            let isPlayer1 = data.player1_id === currentUser.id;
            let playerWon = (isPlayer1 && data.winner_id === currentUser.id) || (!isPlayer1 && data.winner_id === currentUser.id);
            
            if (playerWon) {
                alert("🎉 ПОБЕДА! +25 трофеев, +50 монет");
                currentUser.trophies += 25;
                currentUser.currency += 50;
            } else if (data.winner_id) {
                alert("💔 ПОРАЖЕНИЕ! -8 трофеев");
                currentUser.trophies = Math.max(0, currentUser.trophies - 8);
            }
            await saveUser();
            updateUI();
            
            document.getElementById("battlePanel").classList.remove("active");
            document.getElementById("lobbyPanel").classList.add("active");
            loadLobby();
            currentBattle = null;
            currentBattleId = null;
            return;
        }
        
        // Обновляем текущий ход и счёт
        let isPlayer1 = data.player1_id === currentUser.id;
        let currentPlayerScore = isPlayer1 ? data.player1_score : data.player2_score;
        let currentOpponentScore = isPlayer1 ? data.player2_score : data.player1_score;
        
        if (currentBattle) {
            currentBattle.turn = data.current_turn;
            currentBattle.playerScore = currentPlayerScore;
            currentBattle.opponentScore = currentOpponentScore;
            currentBattle.round = data.round;
            
            document.getElementById("scoreDisplay").innerHTML = `${currentBattle.playerScore}:${currentBattle.opponentScore}`;
            document.getElementById("roundNum").innerHTML = currentBattle.round;
        }
        
        // Разблокируем кнопку атаки если наш ход
        if (data.current_turn === currentUser.id) {
            document.getElementById("attackBtn").disabled = false;
        } else {
            document.getElementById("attackBtn").disabled = true;
        }
    }, 1000);
}

// ===== АТАКА В PVP =====
async function attackPvp() {
    if (currentSelected.length !== 4) { 
        alert("Выбери 4 карты!"); 
        return; 
    }
    
    // Проверяем, наш ли ход
    let { data: battleData } = await sb.from("battles").select("current_turn").eq("id", currentBattleId).single();
    if (battleData.current_turn !== currentUser.id) {
        alert("Сейчас не твой ход!");
        return;
    }
    
    let attacking = currentSelected.map(i => currentSquad[i]);
    let playerTotal = 0;
    let logs = [];
    
    // Анимация атаки
    for (let idx of currentSelected) {
        let cardElement = document.querySelector(`.card-slot[data-idx="${idx}"]`);
        if (cardElement) {
            cardElement.classList.add('attacking');
            setTimeout(() => cardElement.classList.remove('attacking'), 300);
        }
    }
    
    for (let card of attacking) {
        let dmg = computeDamage(card, currentUser.element, currentBattle.opponentElement);
        playerTotal += dmg;
        logs.push(`${card.name} → ${currentBattle.opponentElement} = ${dmg}`);
    }
    
    // Бот выбирает защищающиеся карты рандомно (для PvP пока так)
    let shuffledOpp = [...currentBattle.opponentSquad];
    for (let i = shuffledOpp.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledOpp[i], shuffledOpp[j]] = [shuffledOpp[j], shuffledOpp[i]];
    }
    let defending = shuffledOpp.slice(0, 4);
    let opponentTotal = 0;
    
    for (let card of defending) {
        let dmg = computeDamage(card, currentBattle.opponentElement, currentUser.element);
        opponentTotal += dmg;
        logs.push(`Враг (${card.name}) → ${currentUser.element} = ${dmg}`);
    }
    
    let playerWonRound = playerTotal > opponentTotal;
    let isPlayer1 = (await sb.from("battles").select("player1_id").eq("id", currentBattleId).single()).data?.player1_id === currentUser.id;
    
    let newPlayerScore = currentBattle.playerScore + (playerWonRound ? 1 : 0);
    let newOpponentScore = currentBattle.opponentScore + (!playerWonRound && opponentTotal > playerTotal ? 1 : 0);
    
    if (currentBattle.round === 3) {
        let playerWonMatch = newPlayerScore > newOpponentScore;
        await sb.from("battles").update({
            status: "finished",
            winner_id: playerWonMatch ? currentUser.id : (isPlayer1 ? currentBattle.opponentId : currentBattle.playerId),
            player1_score: isPlayer1 ? newPlayerScore : newOpponentScore,
            player2_score: isPlayer1 ? newOpponentScore : newPlayerScore
        }).eq("id", currentBattleId);
        
        let trophies = playerWonMatch ? 25 : -8;
        let coins = playerWonMatch ? 50 : 0;
        currentUser.trophies = Math.max(0, currentUser.trophies + trophies);
        currentUser.currency += coins;
        await saveUser();
        updateUI();
        alert(`${playerWonMatch ? "ПОБЕДА!" : "ПОРАЖЕНИЕ"}\n🏆 ${trophies > 0 ? "+" : ""}${trophies}\n💰 +${coins}`);
        
        clearInterval(battleInterval);
        document.getElementById("battlePanel").classList.remove("active");
        document.getElementById("lobbyPanel").classList.add("active");
        loadLobby();
        currentBattle = null;
        currentBattleId = null;
    } else {
        // Передаём ход другому игроку
        let nextTurn = isPlayer1 ? currentBattle.opponentId : currentBattle.playerId;
        await sb.from("battles").update({
            round: currentBattle.round + 1,
            player1_score: isPlayer1 ? newPlayerScore : newOpponentScore,
            player2_score: isPlayer1 ? newOpponentScore : newPlayerScore,
            current_turn: nextTurn
        }).eq("id", currentBattleId);
        
        currentBattle.round++;
        currentBattle.playerScore = newPlayerScore;
        currentBattle.opponentScore = newOpponentScore;
        document.getElementById("roundNum").innerHTML = currentBattle.round;
        document.getElementById("scoreDisplay").innerHTML = `${currentBattle.playerScore}:${currentBattle.opponentScore}`;
        document.getElementById("battleLog").innerHTML = logs.join("<br>") + `\n\nРаунд ${currentBattle.round}! Ход соперника...`;
        
        // Сброс выбранных карт и получение нового отряда
        currentSquad = getRandomSquad();
        currentSelected = [];
        updateBattleDisplay();
        updateSelection();
    }
}

// Обновляем attackBtn, чтобы он вызывал attackPvp для PvP
document.getElementById("attackBtn").onclick = () => {
    if (currentBattle) {
        if (currentBattle.isBot) attackBot();
        else attackPvp();
    }
};
    // ===== БОЙ =====
    async function startBotBattle() {
        if (!currentUser.deck || currentUser.deck.length < 6) { alert("Собери 6+ карт в колоду!"); return; }
        currentSquad = getRandomSquad();
        currentSelected = [];
        let oppElem = ["fire","water","earth","wind"][Math.floor(Math.random()*4)];
        let oppSquad = [];
        for (let i=0;i<6;i++) oppSquad.push(getRandomCardByElement(oppElem));
        currentBattle = { isBot: true, opponentElement: oppElem, opponentSquad: oppSquad, round: 1, playerScore: 0, opponentScore: 0 };
        showBattleScreen();
    }

    function showBattleScreen() {
        document.getElementById("battlePanel").classList.add("active");
        document.getElementById("lobbyPanel").classList.remove("active");
        document.getElementById("waitingPanel").classList.remove("active");
        document.getElementById("deckPanel").classList.remove("active");
        document.getElementById("shopPanel").classList.remove("active");
        
        let opponentName = currentBattle.isBot ? "🤖 Бот" : currentBattle.opponentName;
        let elemIcon = currentBattle.opponentElement === "fire" ? "🔥" : currentBattle.opponentElement === "water" ? "💧" : currentBattle.opponentElement === "earth" ? "🌍" : "💨";
        document.getElementById("battleOpponentName").innerHTML = `${opponentName} ${elemIcon}`;
        document.getElementById("roundNum").innerHTML = currentBattle.round;
        document.getElementById("scoreDisplay").innerHTML = `${currentBattle.playerScore}:${currentBattle.opponentScore}`;
        document.getElementById("battleLog").innerHTML = "Выбери 4 карты для атаки!";
        updateBattleDisplay();
        updateSelection();
    }

    function updateBattleDisplay() {
        let playerField = document.getElementById("playerCardsField");
        playerField.innerHTML = currentSquad.map((card, idx) => `
            <div class="card-slot ${card.rarity} ${currentSelected.includes(idx) ? 'selected' : ''}" onclick="toggleSelect(${idx})" data-idx="${idx}">
                <b>${card.name}</b><br>⚔️ ${card.damage}
            </div>
        `).join('');
        let oppField = document.getElementById("opponentCardsField");
        oppField.innerHTML = Array(6).fill().map(() => `<div class="card-slot enemy-hidden">❓❓❓</div>`).join('');
    }

    function updateSelection() {
        document.getElementById("selectionInfo").innerHTML = `Выбрано: ${currentSelected.length}/4`;
        document.getElementById("attackBtn").disabled = currentSelected.length !== 4;
    }

    window.toggleSelect = (idx) => {
        let index = currentSelected.indexOf(idx);
        if (index === -1) {
            if (currentSelected.length < 4) currentSelected.push(idx);
        } else {
            currentSelected.splice(index, 1);
        }
        updateBattleDisplay();
        updateSelection();
    };

    async function attackBot() {
        if (currentSelected.length !== 4) { alert("Выбери 4 карты!"); return; }
        
        let attacking = currentSelected.map(i => currentSquad[i]);
        let playerTotal = 0;
        let logs = [];
        
        // Анимация атаки
        for (let idx of currentSelected) {
            let cardElement = document.querySelector(`.card-slot[data-idx="${idx}"]`);
            if (cardElement) showDamageNumber(cardElement, 0, false);
        }
        
        for (let card of attacking) {
            let dmg = computeDamage(card, currentUser.element, currentBattle.opponentElement);
            playerTotal += dmg;
            logs.push(`${card.name} → ${currentBattle.opponentElement} = ${dmg}`);
        }
        
        let shuffledOpp = [...currentBattle.opponentSquad];
        for (let i = shuffledOpp.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledOpp[i], shuffledOpp[j]] = [shuffledOpp[j], shuffledOpp[i]];
        }
        let defending = shuffledOpp.slice(0, 4);
        let opponentTotal = 0;
        
        // Анимация урона по врагу
        let enemySlots = document.querySelectorAll("#opponentCardsField .card-slot");
        for (let i = 0; i < defending.length && i < enemySlots.length; i++) {
            let dmg = computeDamage(defending[i], currentBattle.opponentElement, currentUser.element);
            opponentTotal += dmg;
            logs.push(`Враг (${defending[i].name}) → ${currentUser.element} = ${dmg}`);
            if (enemySlots[i]) showDamageNumber(enemySlots[i], dmg, true);
        }
        
        await new Promise(r => setTimeout(r, 400));
        
        if (playerTotal > opponentTotal) {
            currentBattle.playerScore++;
            logs.push(`✅ ВЫИГРАЛ РАУНД: ${playerTotal} vs ${opponentTotal}`);
        } else if (opponentTotal > playerTotal) {
            currentBattle.opponentScore++;
            logs.push(`❌ ПРОИГРАЛ РАУНД: ${playerTotal} vs ${opponentTotal}`);
        } else {
            logs.push(`🤝 НИЧЬЯ: ${playerTotal} vs ${opponentTotal}`);
        }
        
        document.getElementById("battleLog").innerHTML = logs.join("<br>");
        document.getElementById("scoreDisplay").innerHTML = `${currentBattle.playerScore}:${currentBattle.opponentScore}`;
        
        if (currentBattle.round === 3) {
            let playerWon = currentBattle.playerScore > currentBattle.opponentScore;
            let trophies = playerWon ? 25 : -8;
            let coins = playerWon ? 100 : 0;
            currentUser.trophies = Math.max(0, currentUser.trophies + trophies);
            currentUser.currency += coins;
            await saveUser();
            updateUI();
            alert(`${playerWon ? "ПОБЕДА!" : "ПОРАЖЕНИЕ"}\n🏆 ${trophies > 0 ? "+" : ""}${trophies}\n💰 +${coins}`);
            currentBattle = null;
            document.getElementById("battlePanel").classList.remove("active");
            document.getElementById("lobbyPanel").classList.add("active");
            loadLobby();
        } else {
            currentBattle.round++;
            document.getElementById("roundNum").innerHTML = currentBattle.round;
            currentSquad = getRandomSquad();
            currentSelected = [];
            updateBattleDisplay();
            updateSelection();
            document.getElementById("battleLog").innerHTML = `Раунд ${currentBattle.round}. Выбери 4 карты!`;
        }
    }

    // ===== АВТОРИЗАЦИЯ =====
    async function register() {
        let username = document.getElementById("regUsername").value.trim();
        let password = document.getElementById("regPassword").value;
        let element = document.getElementById("regElement").value;
        if (!username || !password) { alert("Заполни всё!"); return; }
        
        let hash = btoa(password);
        let { data: existing } = await sb.from("users").select("id").eq("username", username);
        if (existing?.length) { alert("Имя занято!"); return; }
        
        let starterCards = getStarterCards(element);
        let starterDeck = starterCards.map(c => ({ name: c.name, rarity: c.rarity, damage: c.damage }));
        
        let { data, error } = await sb.from("users").insert({
            username, password_hash: hash, element,
            currency: 0, trophies: 0,
            collection: starterCards, deck: starterDeck
        }).select().single();
        
        if (error) { alert("Ошибка: " + error.message); return; }
        currentUser = data;
        saveSession();
        updateUI();
        renderCards();
        document.getElementById("authScreen").classList.remove("active");
        document.getElementById("mainScreen").classList.add("active");
        document.getElementById("lobbyPanel").classList.add("active");
        loadLobby();
        if (lobbyInterval) clearInterval(lobbyInterval);
        lobbyInterval = setInterval(loadLobby, 3000);
    }

    async function login() {
        let username = document.getElementById("loginUsername").value.trim();
        let password = document.getElementById("loginPassword").value;
        let hash = btoa(password);
        let { data, error } = await sb.from("users").select("*").eq("username", username).eq("password_hash", hash).single();
        if (error || !data) { alert("Неверно!"); return; }
        currentUser = data;
        saveSession();
        updateUI();
        renderCards();
        document.getElementById("authScreen").classList.remove("active");
        document.getElementById("mainScreen").classList.add("active");
        document.getElementById("lobbyPanel").classList.add("active");
        loadLobby();
        if (lobbyInterval) clearInterval(lobbyInterval);
        lobbyInterval = setInterval(loadLobby, 3000);
    }

    // ===== СОБЫТИЯ =====
    document.getElementById("doRegisterBtn").onclick = register;
    document.getElementById("doLoginBtn").onclick = login;
    document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); location.reload(); };
    document.getElementById("toDeckBtn").onclick = () => { document.getElementById("deckPanel").classList.add("active"); document.getElementById("lobbyPanel").classList.remove("active"); document.getElementById("waitingPanel").classList.remove("active"); document.getElementById("shopPanel").classList.remove("active"); document.getElementById("battlePanel").classList.remove("active"); renderCards(); };
    document.getElementById("toShopBtn").onclick = () => { document.getElementById("shopPanel").classList.add("active"); document.getElementById("deckPanel").classList.remove("active"); document.getElementById("lobbyPanel").classList.remove("active"); document.getElementById("waitingPanel").classList.remove("active"); document.getElementById("battlePanel").classList.remove("active"); };
    document.getElementById("toLobbyBtn").onclick = () => { document.getElementById("lobbyPanel").classList.add("active"); document.getElementById("deckPanel").classList.remove("active"); document.getElementById("waitingPanel").classList.remove("active"); document.getElementById("shopPanel").classList.remove("active"); document.getElementById("battlePanel").classList.remove("active"); loadLobby(); };
    document.getElementById("leagueBtn").onclick = () => { 
        let league = leagues.find(l => currentUser.trophies >= l.min && currentUser.trophies < l.max) || leagues[5];
        document.getElementById("leagueInfo").innerHTML = `<div style="background:#00000055; border-radius:24px; padding:20px;"><h3>${league.name}</h3><p>🎁 Награда за лигу: ${league.reward} монет</p></div>`;
        document.getElementById("leaguePanel").classList.add("active");
        document.getElementById("lobbyPanel").classList.remove("active");
        document.getElementById("deckPanel").classList.remove("active");
        document.getElementById("waitingPanel").classList.remove("active");
        document.getElementById("shopPanel").classList.remove("active");
        document.getElementById("battlePanel").classList.remove("active");
    };
    document.getElementById("botBattleBtn").onclick = startBotBattle;
    document.getElementById("createLobbyBtn").onclick = createBattle;
    document.getElementById("cancelBattleBtn").onclick = async () => {
        if (currentBattleId) await cancelBattle(currentBattleId);
        clearInterval(waitingInterval);
        document.getElementById("waitingPanel").classList.remove("active");
        document.getElementById("lobbyPanel").classList.add("active");
        loadLobby();
        currentBattleId = null;
    };
    document.getElementById("attackBtn").onclick = () => {
        if (currentBattle && currentBattle.isBot) attackBot();
    };

    loadSession();
    if (currentUser) {
        if (lobbyInterval) clearInterval(lobbyInterval);
        lobbyInterval = setInterval(loadLobby, 3000);
    }
</script>
